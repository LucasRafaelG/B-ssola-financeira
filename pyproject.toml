[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bussola"
version = "0.1.0"
description = "Busca, organiza e projeta gastos pessoais numa planilha do Google Sheets."
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "pandas>=3.0",
    "gspread>=6.1",
    "google-auth>=2.35",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.40",
]
dev = [
    "pytest>=8.3",
    "responses>=0.25",
    "mypy>=1.13",
    "types-requests>=2.32",
    "pandas-stubs>=3.0",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
]

[tool.setuptools]
packages = ["bussola"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["bussola", "app", "tests"]
